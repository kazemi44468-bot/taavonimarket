name: Normalize Taavoni Market source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make repository pages self-contained
        shell: bash
        run: |
          set -e
          changed=0
          python3 - <<'PY'
          from pathlib import Path
          changed=False
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts or '_site' in p.parts:
                  continue
              text=p.read_text(encoding='utf-8')
              original=text
              if 'assets/css/site.css' not in text:
                  text=text.replace('</head>','<link rel="stylesheet" href="assets/css/site.css"></head>',1)
              if 'assets/js/site.js' not in text:
                  text=text.replace('</body>','<script src="assets/js/site.js"></script></body>',1)
              if text!=original:
                  p.write_text(text,encoding='utf-8')
                  changed=True
          raise SystemExit(0 if changed else 0)
          PY
          if git diff --quiet; then
            echo 'Source already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'یکپارچه‌سازی نسخه اصلی صفحات'
          git push
