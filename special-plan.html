<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="جزئیات طرح ویژه تعاونی مارکت"><title>طرح ویژه | تعاونی مارکت</title><link rel="stylesheet" href="assets/css/style.css"><style>:root{--i:#17342f;--g:#28765f;--a:#b58a45;--bg:#f5f3ee;--p:#fffdf9;--l:#e4ddd1;--m:#68766f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:Vazirmatn,Arial,sans-serif;font-size:16px}.page{max-width:1120px;margin:auto;padding:22px 18px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:7px 2px 20px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--i)}.logo{width:42px;height:42px;border-radius:12px;background:var(--i);display:grid;place-items:center;gap:3px;grid-template-columns:repeat(3,5px)}.logo i{width:5px;height:21px;border-radius:5px;background:#d8bb78}.brand strong{display:block;font-size:16px}.brand small{display:block;color:var(--m);font-size:11px;margin-top:3px}.back{border:1px solid var(--l);background:var(--p);border-radius:10px;padding:10px 15px;color:var(--g);font-size:13px;font-weight:800;text-decoration:none}.hero{background:linear-gradient(135deg,#102d27,#28765f);color:#fff;border-radius:24px;padding:38px;box-shadow:0 18px 45px #17342f18}.crumb{font-size:12px;color:#e2c67f;font-weight:800;margin-bottom:13px}.hero h1{font-size:clamp(30px,4vw,46px);line-height:1.45;margin:0 0 11px}.hero p{font-size:16px;line-height:2.15;color:#d8e4df;max-width:790px;margin:0}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:19px}.chip{padding:8px 12px;border:1px solid #ffffff24;border-radius:18px;font-size:12px;color:#ead9b0;background:#ffffff0d}.audience{margin-top:17px;padding:14px 16px;border:1px solid #ffffff24;border-radius:14px;background:#ffffff0b}.audience small{display:block;color:#c8d8d2;font-size:11px;margin-bottom:5px}.audience strong{font-size:15px;line-height:1.9}.layout{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:17px;margin-top:17px}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:25px;margin-bottom:15px}.card h2{font-size:22px;line-height:1.5;margin:0 0 15px}.card h3{font-size:16px;margin:22px 0 10px}.card p{font-size:15px;line-height:2.25;color:#52635b;margin:0}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:17px}.fact{background:#f5f2eb;border-radius:11px;padding:13px}.fact small,.stat small{display:block;font-size:11px;color:var(--m);margin-bottom:5px}.fact strong,.stat strong{font-size:14px;line-height:1.8}.list{margin:0;padding:0;list-style:none;display:grid;gap:9px}.list li{font-size:14px;line-height:2;padding:11px 12px;background:#f5f7f4;border-radius:9px}.list li:before{content:'✓';color:var(--a);font-weight:900;margin-left:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:17px}.stat{border:1px solid var(--l);border-radius:11px;padding:13px;background:#fff}.payment-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pay-item{border:1px solid var(--l);background:#fff;border-radius:12px;padding:13px}.pay-item strong{display:block;font-size:14px;margin-bottom:5px}.pay-item span{display:inline-block;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:800;background:#eef3ef;color:#3f695b}.pay-note{font-size:13px!important;margin-top:13px!important;color:var(--m)!important}.steps{display:grid;gap:10px}.step{display:grid;grid-template-columns:34px 1fr;gap:10px}.step b{width:34px;height:34px;border-radius:50%;background:#e9f0eb;color:var(--g);display:grid;place-items:center;font-size:13px}.step span{font-size:14px;line-height:2.05;padding-top:4px}.notice{padding:13px 14px;border:1px solid var(--l);border-radius:12px;background:#f7f8f5;margin-bottom:9px}.notice strong{display:block;font-size:14px;margin-bottom:4px}.notice span{font-size:12px;color:var(--m);line-height:1.9}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo{min-height:145px;border-radius:14px;background:linear-gradient(135deg,#e7eee9,#f4ead6);border:1px solid var(--l);display:grid;place-items:center;text-align:center;padding:15px;color:#65746d;font-size:13px}.contact{background:linear-gradient(145deg,#17342f,#235e50);color:#fff;border:0}.contact .role{font-size:12px;color:#dec589;font-weight:800}.contact .person{font-size:20px;font-weight:900;margin:7px 0 15px}.contact-row{border-top:1px solid #ffffff18;padding:12px 0}.contact-row small{display:block;font-size:11px;color:#c8d8d2;margin-bottom:5px}.contact-row a,.contact-row span{font-size:14px;color:#fff;text-decoration:none;line-height:1.9}.contact-note{font-size:12px!important;color:#c8d8d2!important;line-height:2!important}.cta{margin-top:15px;background:#eee5d5;border-radius:18px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.cta strong{font-size:16px}.cta span{display:block;font-size:12px;color:#766e5a;margin-top:5px}.cta a{background:var(--i);color:#fff;text-decoration:none;border-radius:10px;padding:11px 17px;font-size:13px;font-weight:800}@media(max-width:850px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.page{padding:13px 12px 38px}.top{padding-bottom:14px}.brand strong{font-size:14px}.brand small{font-size:10px}.back{font-size:12px;padding:9px 11px}.hero{padding:27px 20px;border-radius:20px}.hero h1{font-size:29px}.hero p{font-size:15px}.audience strong{font-size:14px}.card{padding:19px 16px}.card h2{font-size:20px}.card p{font-size:14px}.facts{grid-template-columns:1fr}.stats,.payment-grid{grid-template-columns:1fr 1fr}.list li{font-size:13px}.gallery{grid-template-columns:1fr 1fr}.contact .person{font-size:18px}.contact-row a,.contact-row span{font-size:13px}.cta{display:block}.cta a{display:inline-block;margin-top:13px}}@media(max-width:390px){.stats,.payment-grid,.gallery{grid-template-columns:1fr}.top{display:block}.back{display:inline-block;margin-top:10px}}</style></head><body><main class="page"><header class="top"><a class="brand" href="index.html"><span class="logo"><i></i><i></i><i></i></span><span><strong>تعاونی مارکت</strong><small>فروشگاه اختصاصی تعاونی</small></span></a><a class="back" href="special-plans.html">← بازگشت به طرح‌های ویژه</a></header><div id="app"></div></main><script>const fa=n=>String(n??'').replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const id=new URLSearchParams(location.search).get('id')||'fashion-14';const li=a=>(a||[]).map(x=>'<li>'+esc(x)+'</li>').join('');const val=(x,f='قابل بررسی')=>x===true?'دارد':x===false?'ندارد':(x||f);function contact(c){if(!c)return '';let s='<aside class="card contact"><div class="role">'+esc(c.department||'مرجع ارتباط طرح')+'</div><div class="person">'+esc(c.name||'مسئول طرح')+'</div><div class="contact-row"><small>سمت / مسئولیت</small><span>'+esc(c.title||'مدیریت و هماهنگی طرح')+'</span></div>';if(c.phone)s+='<div class="contact-row"><small>تلفن</small><a href="tel:'+esc(c.phone)+'">'+esc(fa(c.phone))+'</a></div>';if(c.mobile)s+='<div class="contact-row"><small>همراه</small><a href="tel:'+esc(c.mobile)+'">'+esc(fa(c.mobile))+'</a></div>';if(c.email)s+='<div class="contact-row"><small>ایمیل</small><a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a></div>';return s+(c.hours?'<div class="contact-row"><small>زمان پاسخ‌گویی</small><span>'+esc(c.hours)+'</span></div>':'')+(c.note?'<p class="contact-note">'+esc(c.note)+'</p>':'')+'</aside>'}function render(p){document.title=esc(p.name)+' | تعاونی مارکت';document.querySelector('meta[name="description"]').content=p.summary||p.name;const audience=(p.audience||[]).map(esc).join('، ')||'طبق اعلام طرح';const pay=p.payment||{};const news=(p.news||[]).map(x=>'<div class="notice"><strong>'+esc(x.title)+'</strong><span>'+esc(x.date||'')+' · '+esc(x.text||'')+'</span></div>').join('')||'<p>اطلاعیه‌ای ثبت نشده است.</p>';const photos=(p.photos||[]).map(x=>'<div class="photo">'+esc(x)+'</div>').join('')||'<div class="photo">تصویر طرح بعداً اضافه می‌شود</div>';const facts='<div class="facts"><div class="fact"><small>وضعیت</small><strong>'+esc(p.status||'—')+'</strong></div><div class="fact"><small>تاریخ شروع</small><strong>'+esc(p.start_date||'طبق اعلام')+'</strong></div><div class="fact"><small>تاریخ پایان</small><strong>'+esc(p.end_date||'تا اطلاع بعدی')+'</strong></div><div class="fact"><small>محدوده پوشش</small><strong>'+esc(p.coverage||'—')+'</strong></div></div>';const payments='<div class="payment-grid"><div class="pay-item"><strong>خرید نقدی</strong><span>'+val(pay.cash)+'</span></div><div class="pay-item"><strong>خرید اقساطی</strong><span>'+val(pay.installments,p.installments||'قابل بررسی')+'</span></div><div class="pay-item"><strong>پرداخت آسان</strong><span>'+val(pay.easy_payment)+'</span></div><div class="pay-item"><strong>کسر از حقوق</strong><span>'+val(pay.salary_deduction)+'</span></div></div><p class="pay-note">روش نهایی پرداخت و شرایط اقساط باید پیش از ثبت سفارش یا فعال‌سازی، طبق مقررات همان طرح تأیید شود.</p>';document.getElementById('app').innerHTML='<section class="hero"><div class="crumb">'+esc(p.code||'TAAVONI SPECIAL PLAN')+' · '+esc(p.status||'طرح ویژه')+'</div><h1>'+esc(p.name)+'</h1><p>'+esc(p.short_title||p.summary)+'</p><div class="chips"><span class="chip">نوع طرح: '+esc(p.type||'ویژه')+'</span><span class="chip">ارائه‌دهنده: '+esc(p.provider||'تعاونی مارکت')+'</span></div><div class="audience"><small>مخاطبان و استفاده‌کنندگان طرح</small><strong>'+audience+'</strong></div></section><div class="layout"><article><div class="card"><h2>معرفی و مشخصات</h2><p>'+esc(p.description||p.summary)+'</p>'+facts+'</div><div class="card"><h2>شرایط و ویژگی‌ها</h2><ul class="list">'+li(p.benefits)+'</ul><h3>شرایط استفاده</h3><ul class="list">'+li(p.conditions)+'</ul></div><div class="card"><h2>خرید و پرداخت</h2>'+payments+'<div class="stats"><div class="stat"><small>سقف اعتبار</small><strong>'+esc(p.credit_limit||'—')+'</strong></div><div class="stat"><small>حداقل خرید</small><strong>'+esc(p.minimum_purchase||'—')+'</strong></div><div class="stat"><small>تخفیف / مزیت</small><strong>'+esc(p.discount||'—')+'</strong></div><div class="stat"><small>تعداد اقساط</small><strong>'+esc(p.installments||'—')+'</strong></div></div></div><div class="card"><h2>جزئیات اقساط</h2><div class="stats">'+(p.installment_details||[]).map(x=>'<div class="stat"><small>'+esc(x.label)+'</small><strong>'+esc(x.value)+'</strong></div>').join('')+'</div><p style="margin-top:14px">'+esc(p.installment_note||'جزئیات اقساط قابل ویرایش است.')+'</p></div><div class="card"><h2>اخبار و اطلاعیه‌ها</h2>'+news+'</div><div class="card"><h2>تصاویر طرح</h2><div class="gallery">'+photos+'</div></div><div class="card"><h2>نحوه استفاده</h2><div class="steps">'+(p.usage_steps||[]).map((x,i)=>'<div class="step"><b>'+fa(i+1)+'</b><span>'+esc(x)+'</span></div>').join('')+'</div></div><div class="card"><h2>قوانین و مقررات</h2><ul class="list">'+li(p.rules)+'</ul></div></article><div>'+contact(p.contact)+'<div class="cta"><strong>'+esc(p.cta_label||'اقدام برای طرح')+'<span>برای ثبت درخواست، هماهنگی یا پیگیری وارد حساب عضو شوید.</span></strong><a href="'+esc(p.cta_link||'login.html')+'">ادامه ←</a></div></div></div>'}fetch('assets/data/special-plans.json').then(r=>r.json()).then(d=>{const p=(d.plans||[]).find(x=>x.id===id);p?render(p):document.getElementById('app').innerHTML='<section class="card"><h1>طرح موردنظر پیدا نشد</h1><p>شناسه طرح معتبر نیست.</p><a href="special-plans.html">بازگشت</a></section>'}).catch(()=>document.getElementById('app').innerHTML='<section class="card"><h1>خطا در دریافت اطلاعات طرح</h1><p>لطفاً دوباره تلاش کنید.</p></section>');</script></body></html>
