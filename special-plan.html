<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="جزئیات طرح ویژه تعاونی مارکت"><title>طرح ویژه | تعاونی مارکت</title><link rel="stylesheet" href="assets/css/style.css"><style>:root{--ink:#17342f;--green:#28765f;--gold:#b58a45;--bg:#f5f3ee;--paper:#fffdf9;--line:#e4ddd1;--muted:#77847e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Arial,sans-serif}.page{max-width:1120px;margin:auto;padding:20px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:7px 2px 18px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}.logo{width:38px;height:38px;border-radius:11px;background:var(--ink);display:grid;place-items:center;gap:3px;grid-template-columns:repeat(3,5px)}.logo i{width:5px;height:19px;border-radius:5px;background:#d8bb78}.brand strong{display:block;font-size:12px}.brand small{display:block;color:var(--muted);font-size:7px;margin-top:2px}.back{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 13px;color:var(--green);font-size:8px;font-weight:900;text-decoration:none}.hero{background:linear-gradient(135deg,#102d27,#28765f);color:#fff;border-radius:24px;padding:34px;position:relative;overflow:hidden;box-shadow:0 18px 45px #17342f18}.hero:after{content:'';position:absolute;width:430px;height:430px;border:1px solid #ffffff18;border-radius:50%;left:-180px;bottom:-300px}.hero>*{position:relative;z-index:1}.crumb{font-size:7px;color:#ddc37f;font-weight:900;margin-bottom:12px}.hero h1{font-size:clamp(27px,4vw,45px);line-height:1.45;margin:0 0 9px}.hero p{font-size:10px;line-height:2.2;color:#d8e4df;max-width:760px;margin:0}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:17px}.chip{padding:6px 10px;border:1px solid #ffffff24;border-radius:18px;font-size:7px;color:#e5d3a7;background:#ffffff0d}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:15px;margin-top:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px}.card h2{font-size:18px;margin:0 0 12px}.card h3{font-size:12px;margin:20px 0 8px}.card p{font-size:9px;line-height:2.25;color:#586860;margin:0}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.fact{background:#f5f2eb;border-radius:11px;padding:11px}.fact small{display:block;font-size:6px;color:var(--muted);margin-bottom:4px}.fact strong{font-size:9px}.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}.list li{font-size:8px;line-height:1.9;padding:9px 10px;background:#f5f7f4;border-radius:9px}.list li:before{content:'✓';color:var(--gold);font-weight:900;margin-left:7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.stat{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}.stat small{display:block;font-size:6px;color:var(--muted);margin-bottom:5px}.stat strong{font-size:9px}.steps{counter-reset:step;display:grid;gap:9px}.step{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start}.step b{width:30px;height:30px;border-radius:50%;background:#e9f0eb;color:var(--green);display:grid;place-items:center;font-size:8px}.step span{font-size:8px;line-height:2;padding-top:4px}.contact{background:linear-gradient(145deg,#17342f,#235e50);color:#fff;border:0}.contact h2{color:#fff}.contact .role{font-size:7px;color:#d9c48f;font-weight:900}.contact .person{font-size:15px;font-weight:900;margin:6px 0 13px}.contact-row{border-top:1px solid #ffffff18;padding:10px 0}.contact-row small{display:block;font-size:6px;color:#c8d8d2;margin-bottom:4px}.contact-row a,.contact-row span{font-size:8px;color:#fff;text-decoration:none;line-height:1.8}.contact-note{font-size:7px!important;color:#c8d8d2!important;line-height:2!important;margin-top:10px}.cta{margin-top:15px;background:#eee5d5;border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:14px}.cta strong{font-size:12px}.cta span{display:block;font-size:7px;color:#766e5a;margin-top:4px}.cta a{background:var(--ink);color:#fff;text-decoration:none;border-radius:9px;padding:10px 15px;font-size:8px;font-weight:900;white-space:nowrap}.empty{text-align:center;padding:70px 20px}.empty h1{font-size:25px}.empty p{font-size:9px;color:var(--muted)}.empty a{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;text-decoration:none;border-radius:9px;padding:10px 15px;font-size:8px}@media(max-width:850px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.page{padding:12px 12px 35px}.top{padding-bottom:13px}.hero{padding:25px 19px;border-radius:19px}.card{padding:17px}.facts{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.cta{display:block}.cta a{display:inline-block;margin-top:12px}.hero h1{font-size:28px}.hero p{font-size:9px}}</style></head><body><main class="page"><header class="top"><a class="brand" href="index.html"><span class="logo"><i></i><i></i><i></i></span><span><strong>تعاونی مارکت</strong><small>فروشگاه اختصاصی تعاونی</small></span></a><a class="back" href="special-plans.html">← بازگشت به طرح‌های ویژه</a></header><div id="app"></div></main><script>const fa=n=>String(n??'').replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const params=new URLSearchParams(location.search);const id=params.get('id')||'fashion-14';const money=s=>s?fa(s):'—';const li=a=>(a||[]).map(x=>'<li>'+esc(x)+'</li>').join('');function contact(c){if(!c)return '';let links='';if(c.phone)links+='<div class="contact-row"><small>تلفن ثابت</small><a href="tel:'+esc(c.phone)+'">'+esc(fa(c.phone))+'</a></div>';if(c.mobile)links+='<div class="contact-row"><small>شماره همراه</small><a href="tel:'+esc(c.mobile)+'">'+esc(fa(c.mobile))+'</a></div>';if(c.email)links+='<div class="contact-row"><small>ایمیل</small><a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a></div>';return '<aside class="card contact"><div class="role">'+esc(c.department||'مرجع ارتباط طرح')+'</div><div class="person">'+esc(c.name||'مسئول طرح')+'</div><div class="contact-row"><small>سمت / مسئولیت</small><span>'+esc(c.title||'مدیریت و هماهنگی طرح')+'</span></div>'+links+(c.hours?'<div class="contact-row"><small>زمان پاسخ‌گویی</small><span>'+esc(c.hours)+'</span></div>':'')+(c.note?'<p class="contact-note">'+esc(c.note)+'</p>':'')+'</aside>'}function render(p){document.title=esc(p.name)+' | تعاونی مارکت';document.querySelector('meta[name="description"]').content=p.summary||p.name;const audiences=(p.audience||[]).map(esc).join('، ');document.getElementById('app').innerHTML='<section class="hero"><div class="crumb">'+esc(p.code||'TAAVONI SPECIAL PLAN')+' · '+esc(p.status||'طرح ویژه')+'</div><h1>'+esc(p.name)+'</h1><p>'+esc(p.short_title||p.summary)+'</p><div class="chips"><span class="chip">نوع طرح: '+esc(p.type||'ویژه')+'</span><span class="chip">مخاطب: '+audiences+'</span><span class="chip">ارائه‌دهنده: '+esc(p.provider||'تعاونی مارکت')+'</span></div></section><div class="layout"><article><section class="card"><h2>معرفی طرح</h2><p>'+esc(p.description||p.summary)+'</p><div class="facts"><div class="fact"><small>وضعیت</small><strong>'+esc(p.status||'—')+'</strong></div><div class="fact"><small>تاریخ شروع</small><strong>'+esc(p.start_date||'طبق اعلام طرح')+'</strong></div><div class="fact"><small>تاریخ پایان</small><strong>'+esc(p.end_date||'تا اطلاع بعدی')+'</strong></div><div class="fact"><small>محدوده پوشش</small><strong>'+esc(p.coverage||'—')+'</strong></div></div></section><section class="card"><h2>مزایا و امکانات</h2><ul class="list">'+li(p.benefits)+'</ul></section><section class="card"><h2>شرایط استفاده</h2><ul class="list">'+li(p.conditions)+'</ul><div class="stats"><div class="stat"><small>سقف اعتبار</small><strong>'+money(p.credit_limit)+'</strong></div><div class="stat"><small>حداقل خرید</small><strong>'+money(p.minimum_purchase)+'</strong></div><div class="stat"><small>تخفیف / مزیت</small><strong>'+esc(p.discount||'—')+'</strong></div><div class="stat"><small>اقساط</small><strong>'+esc(p.installments||'—')+'</strong></div></div></section><section class="card"><h2>نحوه استفاده</h2><div class="steps">'+(p.usage_steps||[]).map((x,i)=>'<div class="step"><b>'+fa(i+1)+'</b><span>'+esc(x)+'</span></div>').join('')+'</div></section><section class="card"><h2>فروشگاه‌ها و خدمات مشمول</h2><h3>پذیرندگان / فروشگاه‌ها</h3><ul class="list">'+li(p.stores)+'</ul><h3>کالاها و خدمات</h3><ul class="list">'+li(p.services)+'</ul></section><section class="card"><h2>قوانین و مقررات</h2><ul class="list">'+li(p.rules)+'</ul></section></article><div>'+contact(p.contact)+'<div class="cta"><strong>'+esc(p.cta_label||'اقدام برای طرح')+'<span>برای ثبت درخواست یا پیگیری، وارد حساب عضو شوید.</span></strong><a href="'+esc(p.cta_link||'login.html')+'">ادامه ←</a></div></div></div>'}fetch('assets/data/special-plans.json').then(r=>r.json()).then(d=>{const p=d.plans.find(x=>x.id===id);if(p)render(p);else document.getElementById('app').innerHTML='<section class="card empty"><h1>طرح موردنظر پیدا نشد</h1><p>شناسه طرح معتبر نیست یا این طرح هنوز در فهرست سامانه ثبت نشده است.</p><a href="special-plans.html">بازگشت به طرح‌های ویژه</a></section>'}).catch(()=>{document.getElementById('app').innerHTML='<section class="card empty"><h1>خطا در دریافت اطلاعات طرح</h1><p>لطفاً دوباره تلاش کنید.</p><a href="special-plans.html">بازگشت</a></section>'});</script></body></html>
