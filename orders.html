<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>سفارش‌های من | تعاونی مارکت</title><link rel="stylesheet" href="assets/css/style.css"><style>.wrap{max-width:950px;margin:auto;padding:50px 20px 100px}.head{margin-bottom:20px}.head h1{font-size:clamp(28px,4vw,44px);color:var(--navy);margin:8px 0}.head p{font-size:10px;color:var(--muted)}.list{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:10px}.card b{font-size:12px;color:var(--navy)}.card small{display:block;font-size:8px;color:#8999a4;margin-top:6px}.status{align-self:center;background:#eaf8f6;color:#168e88;border-radius:9px;padding:7px 10px;font-size:8px;font-weight:800}.link{display:inline-block;margin-top:10px;color:#168e88;text-decoration:none;font-size:8px;font-weight:800}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:45px;text-align:center;color:#82929b;font-size:10px}.empty a{display:inline-block;margin-top:15px;color:#168e88}@media(max-width:600px){.wrap{padding:35px 14px 90px}.card{grid-template-columns:1fr}.status{justify-self:start}}</style><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-icon"><i></i><i></i><i></i></span><span><strong>تعاونی مارکت</strong><small>TAAVONI MARKET</small></span></a><a class="account" href="account.html">حساب من</a></header><main><section class="wrap"><div class="head"><span class="eyebrow"><i></i> ORDER HISTORY</span><h1>سفارش‌های من</h1><p>سوابق سفارش‌ها و دسترسی مستقیم به جزئیات و رهگیری هر سفارش.</p></div><div class="list" id="orders"></div></section></main><nav class="mobile-nav"><a href="index.html"><b>⌂</b><span>خانه</span></a><a href="store.html"><b>▱</b><span>فروشگاه</span></a><a href="cart.html"><b>▣</b><span>سبد</span></a><a class="active" href="account.html"><b>◎</b><span>حساب من</span></a></nav><script src="assets/js/orders.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const box=document.querySelector('#orders'),all=TMOrders.getAll();box.innerHTML=all.length?all.map(o=>`<article class="card"><div><b>${o.number}</b><small>${o.date||''} · ${(o.items||[]).map(x=>x.name).join(' · ')} · ${TMOrders.money(o.total)}</small><a class="link" href="order.html?id=${encodeURIComponent(o.id)}">مشاهده جزئیات و رهگیری ←</a></div><span class="status">${o.status||'ثبت شده'}</span></article>`).join(''):'<div class="empty">هنوز سفارشی ثبت نشده است.<br><a href="store.html">ورود به فروشگاه</a></div>'})</script><script src="assets/js/site.js"></script></body></html>
