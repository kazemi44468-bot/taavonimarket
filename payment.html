<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>پرداخت | تعاونی مارکت</title><link rel="stylesheet" href="assets/css/style.css"><style>.pay-wrap{max-width:620px;margin:auto;padding:70px 20px 100px}.pay-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;text-align:center;box-shadow:0 20px 60px #12384d10}.pay-icon{width:64px;height:64px;border-radius:20px;background:#eaf8f6;color:#148d88;display:grid;place-items:center;margin:0 auto 18px;font-size:28px}.pay-card h1{color:var(--navy);font-size:28px;margin:0 0 10px}.pay-card p{font-size:11px;color:#7c8d9a;line-height:2}.pay-summary{display:flex;justify-content:space-between;background:#f7fafb;border-radius:13px;padding:15px;margin:20px 0;color:#5b7284;font-size:10px}.pay-summary b{color:var(--navy);font-size:15px}.demo-pay{display:block;width:100%;border:0;border-radius:12px;background:linear-gradient(110deg,#082840,#147aa4);color:#fff;padding:13px;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer}.secure{margin-top:15px;font-size:8px;color:#92a0aa}@media(max-width:600px){.pay-wrap{padding:45px 16px 90px}.pay-card{padding:22px}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-icon"><i></i><i></i><i></i></span><span><strong>تعاونی مارکت</strong><small>TAAVONI MARKET</small></span></a><a class="account" href="store.html">بازگشت به فروشگاه</a></header><main><section class="pay-wrap"><div class="pay-card"><div class="pay-icon">✓</div><h1>پرداخت اینترنتی</h1><p>درگاه پرداخت در این مرحله نمایشی است. با ادامه، یک سفارش آزمایشی با ساختار آماده اتصال به هسته سفارش ثبت می‌شود.</p><div class="pay-summary"><span>مبلغ سفارش</span><b id="payTotal">۰ تومان</b></div><button class="demo-pay" onclick="demoPay()">ثبت پرداخت آزمایشی و صدور رسید</button><div class="secure">ثبت سفارش • تراکنش • رسید • رهگیری</div></div></section></main><nav class="mobile-nav"><a href="index.html"><b>⌂</b><span>خانه</span></a><a class="active" href="store.html"><b>▱</b><span>فروشگاه</span></a><a href="cart.html"><b>▣</b><span>سبد</span></a><a href="account.html"><b>◎</b><span>حساب من</span></a></nav><script src="assets/js/store.js"></script><script src="assets/js/orders.js"></script><script>document.addEventListener('DOMContentLoaded',()=>document.querySelector('#payTotal').textContent=TMOrders.money(total()));function demoPay(){const c=getCart();if(!c.length){showToast('سبد خرید شما خالی است');return}const now=Date.now(),order={id:'ORD-'+now,number:'TM-1405-'+String(now).slice(-6),customer:{id:'demo-member',name:'عضو نمونه'},cooperative:{id:'central',name:'تعاونی نمونه'},items:c.map(x=>({id:x.id,name:x.name,qty:x.qty,price:x.price})),subtotal:total(),discount:0,shipping:0,total:total(),payment:{method:'پرداخت اینترنتی',status:'موفق',tracking:'TRX-'+String(now).slice(-8)},fulfillment:{method:'ارسال تعاونی',status:'در حال آماده‌سازی',trackingNumber:''},status:'آماده‌سازی',date:new Intl.DateTimeFormat('fa-IR',{dateStyle:'long'}).format(new Date()),createdAt:new Date().toISOString()};TMOrders.save(order);localStorage.removeItem('taavoniCart');location.href='receipt.html?id='+encodeURIComponent(order.id)}</script></body></html>
